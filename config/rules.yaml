# 검증 규칙 설정. 정규식·허용오차·규칙 사용 여부는 코드에 하드코딩하지 않고 여기에 둔다.

tolerance:
  amount: 0                 # 대사 금액 허용오차 (원). 0이면 완전 일치. 건수는 항상 완전 일치

formats:
  account_no: '^\d{3}-\d{2}-\d{6}$'   # ASCII 숫자만 허용 (전각 숫자는 형식 오류)
  txn_dt: '%Y-%m-%d %H:%M:%S'
  date: '%Y-%m-%d'

values:
  direction: [D, W]         # D 입금, W 출금

runtime:
  stale_running_minutes: 60 # 다음 실행 시작 때 이 시간보다 오래 RUNNING인 실행을 FAILED로 정리

rules:                      # false로 바꾸면 해당 규칙을 실행하지 않는다
  DQ-01: true   # 필수값 누락
  DQ-02: true   # 계좌번호 형식
  DQ-03: true   # 거래일시 형식·범위
  DQ-04: true   # 금액 형식
  DQ-05: true   # 입출금 구분 값
  DQ-06: true   # 거래번호 중복
  DQ-07: true   # 의심 중복 (WARN)
  MD-01: true   # 미등록 계좌
  MD-02: true   # 계좌 유효기간 외 거래
  MD-03: true   # 미등록·폐지 거래코드
  MD-04: true   # 코드-방향 불일치
  MD-05: true   # 지급정지 계좌 출금 (WARN)
  SM-01: true   # 집계표 자체 오류
  RC-01: true   # 계좌 존재 불일치
  RC-02: true   # 입금 불일치
  RC-03: true   # 출금 불일치
  RC-04: true   # 잔액 등식 불일치
