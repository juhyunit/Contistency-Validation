[project]
name = "recon"
version = "0.1.0"
description = "금융 데이터 검증·대사 자동화 (거래내역 품질 검증, 기준정보 정합성, 집계 대사)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
